name: Publish to PyPI

# Fires ONLY when a maintainer manually publishes a GitHub Release — never on
# push or tag-create. Cutting the Release is the human gate; nothing here
# runs unattended before that.
#
# workflow_dispatch is a maintainer-run dry run: it executes checkout, build,
# twine-check, and hashing and skips every publishing step, so the pipeline
# can be exercised without cutting a Release.
on:
  release:
    types: [published]
  workflow_dispatch: {}

# This repository's Actions policy rejects every step-level `uses:` ref
# outside ReticleWorks — any external action fails the whole run at startup
# (every release since 0.20.0 has ended in startup_failure). This workflow
# therefore uses `run:` steps only: git fetch in place of actions/checkout,
# twine in place of pypa/gh-action-pypi-publish, `gh release upload` in place
# of upload/download-artifact, and a PyJWT-minted installation token in
# place of actions/create-github-app-token. Do not reintroduce external
# `uses:` refs here — the pipeline goes straight back to startup_failure.
permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chitra-monitor/
    permissions:
      # gh release upload needs contents:write; scoped to this job only.
      contents: write
    steps:
      - name: Check out the released commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Pin the build timestamp to the tagged commit
        run: |
          # SOURCE_DATE_EPOCH makes the wheel byte-reproducible: setuptools
          # stamps archive member mtimes from it instead of the wall clock,
          # so a re-run on the same tag yields the same sha256. research-ops
          # pins wheels by release-asset sha256, so this is a requirement,
          # not a nicety.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install build tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: .venv/bin/python -m build

      - name: Check distribution metadata
        run: .venv/bin/python -m twine check dist/*

      - name: Print distribution hashes
        run: sha256sum dist/*

      - name: Attach distributions to the GitHub Release
        # Before the PyPI upload so a failed publish leaves a clean,
        # rerunnable state; --clobber makes the attach itself idempotent.
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish to PyPI
        # Equivalent to pypa/gh-action-pypi-publish with a project-scoped API
        # token: `twine upload` with __token__ auth. PyPI attestations
        # require trusted publishing, which this repository does not use, so
        # there is no attestation step (attestations: false in the action).
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: .venv/bin/python -m twine upload --disable-progress-bar dist/*

  notify-fleet:
    name: Notify fleet-repo of the release
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Same dispatch contract as before: a short-lived polyphony-automation
      # installation token scoped to ReticleWorks/fleet-repo. It is minted
      # inline with PyJWT because actions/create-github-app-token is blocked
      # by this repo's policy. If minting or dispatch fails, the step fails
      # closed without touching PyPI state, and fleet-repo's weekly poll
      # enumerates every unreconciled release as the fallback path.
      - name: Install token tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet 'pyjwt[crypto]'

      - name: Mint polyphony-automation installation token
        id: fleet-token
        env:
          APP_ID: ${{ secrets.FLEET_DISPATCH_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FLEET_DISPATCH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PYEOF'
          import json, os, time, urllib.request

          import jwt

          now = int(time.time())
          app_jwt = jwt.encode(
              {"iat": now - 60, "exp": now + 540, "iss": os.environ["APP_ID"]},
              os.environ["APP_PRIVATE_KEY"],
              algorithm="RS256",
          )

          def call(method, path, body=None):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={
                      "Authorization": "Bearer " + app_jwt,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              return json.load(urllib.request.urlopen(req))

          inst = call("GET", "/repos/ReticleWorks/fleet-repo/installation")
          tok = call(
              "POST",
              "/app/installations/{}/access_tokens".format(inst["id"]),
              {"repositories": ["fleet-repo"]},
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("token=" + tok["token"] + "\n")
          PYEOF

      - name: Send repository_dispatch to ReticleWorks/fleet-repo
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
        run: |
          gh api repos/ReticleWorks/fleet-repo/dispatches \
            -f event_type=chitra-release \
            -F 'client_payload[repository]=${{ github.repository }}' \
            -F 'client_payload[tag]=${{ github.event.release.tag_name }}' \
            -F 'client_payload[release_url]=${{ github.event.release.html_url }}'
