name: Publish to PyPI

# Fires ONLY when a maintainer manually publishes a GitHub Release — never on
# push or tag-create. Cutting the Release is the human gate; nothing here
# runs unattended before that.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chitra-monitor/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PyPI attestations require trusted publishing. This repository uses
          # a project-scoped API token until its PyPI publisher is configured.
          attestations: false
          print-hash: true

  notify-fleet:
    name: Notify fleet-repo of the release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # ReticleWorks/fleet-repo pins this distribution and opens its own pin
      # bump pull request on each release; GitHub has no cross-repo release
      # trigger, so the fleet listens for a repository_dispatch of type
      # chitra-release instead. The default job token cannot dispatch to
      # another repository, so this job mints a short-lived installation
      # token at runtime for the polyphony-automation GitHub App (installed
      # on all ReticleWorks repos) from the repo secrets
      # FLEET_DISPATCH_APP_ID and FLEET_DISPATCH_APP_PRIVATE_KEY, scoped to
      # ReticleWorks/fleet-repo only. If minting or dispatch fails, the step
      # fails closed without touching PyPI state, and fleet-repo's weekly
      # poll enumerates every unreconciled release as the fallback path.
      - uses: actions/create-github-app-token@v1
        id: fleet-token
        with:
          app-id: ${{ secrets.FLEET_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FLEET_DISPATCH_APP_PRIVATE_KEY }}
          owner: ReticleWorks
          repositories: fleet-repo

      - name: Send repository_dispatch to ReticleWorks/fleet-repo
        env:
          GH_TOKEN: ${{ steps.fleet-token.outputs.token }}
        run: |
          gh api repos/ReticleWorks/fleet-repo/dispatches \
            -f event_type=chitra-release \
            -F 'client_payload[repository]=${{ github.repository }}' \
            -F 'client_payload[tag]=${{ github.event.release.tag_name }}' \
            -F 'client_payload[release_url]=${{ github.event.release.html_url }}'
