name: CodeQL

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  analyze:
    # EXCEPTION: the self-hosted fleet is Linux/ARM64, while the current
    # CodeQL CLI release v2.26.2 publishes codeql-linux64.zip (x86_64),
    # codeql-osx64.zip, and codeql-win64.zip, with no Linux/ARM64 bundle.
    # Keep this weekly scan on hosted x64 until CodeQL publishes a native
    # Linux/ARM64 bundle.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
