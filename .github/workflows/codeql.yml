name: CodeQL

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  analyze:
    # GitHub's CodeQL CLI does not support the estate's Linux ARM64 runners.
    # Keep this weekly scan on hosted x64 rather than dropping the security gate.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
