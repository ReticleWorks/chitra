# Chitra capability manifest (HFR: human-facing resource).
# Read this as a declarative, narrow authority document: an enabled entry
# grants only its listed command surface and never a general shell privilege.
schema: chitra.capabilities.v1
capabilities:
  - name: dispatchd
    kind: daemon
    purpose: Drain the deterministic local dispatch order queue into tmux lanes.
    when_to_use: Run as the supervised queue-delivery daemon after an external caller has written a valid order.
    authority:
      level: record
      grants:
        - Consume validated local dispatch orders and record their results.
      excludes:
        - Decide message content.
        - Merge, approve, or modify pull requests.
    default_enabled: true
    commands:
      - name: dispatchd
        description: Start the local deterministic dispatch daemon.
        argv: [dispatchd]
        params: []
        mutates: true

  - name: triaged
    kind: daemon
    purpose: Tail lane events and emit deterministic state-transition records.
    when_to_use: Run as the supervised event-triage daemon for an existing events log.
    authority:
      level: record
      grants:
        - Read lane events and write deduplicated local triage records.
      excludes:
        - Dispatch messages.
        - Merge, approve, or modify pull requests.
    default_enabled: true
    commands:
      - name: triaged
        description: Start the local deterministic triage daemon.
        argv: [triaged]
        params: []
        mutates: true

  - name: sweepd
    kind: daemon
    purpose: Produce a compact delta digest from already-digested fleet state.
    when_to_use: Run as the supervised sensing daemon so the foreground monitor can consume one small digest per sweep.
    authority:
      level: record
      grants:
        - Read compact Chitra state stores and write a delta digest plus its local baseline.
      excludes:
        - Read conversation transcripts or invoke an LLM.
        - Dispatch messages, merge, approve, or modify pull requests.
    default_enabled: true
    commands:
      - name: chitra-sweepd
        description: Start the deterministic fleet-state digest daemon.
        argv: [chitra-sweepd]
        params: []
        mutates: true

  - name: draft-scanner
    kind: daemon
    purpose: Detect unsubmitted drafts in configured tmux input boxes.
    when_to_use: Run periodically when an operator wants flag-only visibility into lingering drafts.
    authority:
      level: observe
      grants:
        - Inspect configured tmux panes and report draft presence.
      excludes:
        - Submit, discard, or edit a draft.
        - Merge, approve, or modify pull requests.
    default_enabled: true
    commands:
      - name: draft-scanner
        description: Start the flag-only draft scanner daemon.
        argv: [draft-scanner]
        params: []
        mutates: false

  - name: usage
    kind: tool
    purpose: Read provider usage snapshots and evaluate deterministic thresholds.
    when_to_use: Use before scheduling work when rate-limit state may constrain a lane or account.
    authority:
      level: observe
      grants:
        - Read usage snapshots and calculate a threshold verdict.
      excludes:
        - Pause, resume, or dispatch to a lane.
        - Change provider account settings.
    default_enabled: true
    commands:
      - name: chitra-usage
        description: Read usage snapshots or print their deterministic evaluation.
        argv: [chitra-usage]
        params: []
        mutates: false

  - name: goals
    kind: tool
    purpose: Record the monitor-stated goal and explicit status for a lane.
    when_to_use: Use when a stated lane goal, hold, or open operator ask must survive a monitor restart.
    authority:
      level: record
      grants:
        - Store and retrieve deterministic per-lane goal records.
      excludes:
        - Generate goals or decide whether work is complete.
        - Merge, approve, or modify pull requests.
    default_enabled: true
    commands:
      - name: chitra-goals
        description: Store, inspect, or render deterministic lane goal records.
        argv: [chitra-goals]
        params: []
        mutates: true

  - name: artifacts
    kind: tool
    purpose: Record Claude artifact publication and explicit review metadata.
    when_to_use: Use when an artifact URL and its review state need durable, deterministic bookkeeping.
    authority:
      level: record
      grants:
        - Store artifact metadata and explicit review state.
      excludes:
        - Publish an artifact.
        - Decide review content or merge pull requests.
    default_enabled: true
    commands:
      - name: chitra-artifacts
        description: Store and inspect deterministic artifact review records.
        argv: [chitra-artifacts]
        params: []
        mutates: true

  - name: convo
    kind: tool
    purpose: Record structured operator and lane conversation facts.
    when_to_use: Use when a monitor must preserve a decision, directive, or operator brief verbatim.
    authority:
      level: record
      grants:
        - Append and render structured local conversation records.
      excludes:
        - Invent conversation content.
        - Dispatch messages or modify pull requests.
    default_enabled: true
    commands:
      - name: chitra-convo
        description: Record and inspect structured conversation facts.
        argv: [chitra-convo]
        params: []
        mutates: true

  - name: lane-anchor
    kind: tool
    purpose: Launch one ingestion-gated interactive tmux lane on Tophand with an approved backend and model.
    when_to_use: Run for a declared lane after its complete goal record exists and a backend/model is selected. Supported backends are Claude, Codex, and OpenCode. Provider routing belongs to oss-step task metadata; it may select OpenRouter through Crush, OpenCode free, or authenticated OpenCode Zen.
    authority:
      level: act
      grants:
        - Create, start an agent in, or inspect the tmux session named by one rendered lane declaration.
      excludes:
        - Launch on a host other than Tophand or bypass a goal or usage-pause refusal.
        - Create accounts, alter credentials, or touch an undeclared session.
    default_enabled: true
    commands:
      - name: chitra-lane-anchor
        description: Create, stop, or inspect one governed Tophand tmux lane.
        argv: [chitra-lane-anchor]
        params: []
        mutates: true
      - name: chitra-lane-session
        description: Launch, stop, or inspect one governed Tophand tmux lane.
        argv: [chitra-lane-session]
        params: []
        mutates: true

  - name: agent-status
    kind: tool
    purpose: Report and inspect deterministic semantic state for a supervised pane.
    when_to_use: Use from a supervised agent lifecycle hook or an operator diagnostic against the local Watchd socket.
    authority:
      level: record
      grants:
        - Report lifecycle state for an exact pane and inspect, wait for, or explain semantic state.
        - Print the local socket protocol schema.
      excludes:
        - Send input, grant approval, or decide whether an agent should be blocked.
        - Bypass completion review or claim permission from status alone.
    default_enabled: true
    commands:
      - name: chitra-agent
        description: Report, explain, wait for, or inspect deterministic pane status.
        argv: [chitra-agent]
        params: []
        mutates: true

  - name: capability-management
    kind: tool
    purpose: Inspect and reversibly record per-capability runtime toggles.
    when_to_use: Use when an operator needs to inspect, time-box, enable, disable, or reset one declared tool capability.
    authority:
      level: record
      grants:
        - Record only per-capability enablement overrides in the local state directory.
      excludes:
        - Enable a daemon.
        - Grant global shell, git, GitHub, merge, or approval authority.
    default_enabled: true
    commands:
      - name: chitra-capabilities
        description: Inspect or record one reversible capability toggle.
        argv: [chitra-capabilities]
        params: []
        mutates: true

  - name: decisions-log
    kind: tool
    purpose: Keep an append-only record of consequential monitor decisions and their authority.
    when_to_use: Use immediately after a monitor adjudication, override, redirect, pause, resume, ask retirement, or work-session architecture change.
    authority:
      level: record
      grants:
        - Append a complete decision, basis, citation, and authority record to the local decisions log.
        - Read the decisions log in append order.
      excludes:
        - Make a decision merely because this recording tool is available.
        - Rewrite or delete an earlier decision record.
    default_enabled: true
    commands:
      - name: chitra-decisions
        description: Append or list consequential monitor decisions.
        argv: [chitra-decisions]
        params: []
        mutates: true

  - name: rate-limit-guard
    kind: tool
    purpose: >-
      Drive a durable pause/resume transaction machine for a session nearing its provider
      rate/session limit: checkpoint it, confirm the turn actually stopped, hold it, then
      resume it once the window resets and dispatchd has redelivered its deferred backlog.
    when_to_use: Run under an external timer (systemd timer / cron), one host at a time, against that host's chitra-usage snapshot directory.
    authority:
      level: act
      grants:
        - Hold or resume a chitra goal record for a rate-limit reason, preserving its stored goal as the re-arm payload.
        - Gracefully shed and progressively resume tracked lanes in response to persisted host-memory pressure levels.
        - Enqueue a fixed checkpoint, stop-clear, or goal-templated resume nudge onto the local dispatch order queue.
        - Requeue a held session's deferred backlog (FIFO, exactly once) after a confirmed resume.
        - Answer a read-only ownership query for supplied session references without acting on the lanes.
      excludes:
        - Author, judge, or vary nudge content -- every nudge is a fixed/templated literal, never LLM-generated.
        - Override an operator- or throttle-held lane, or resume into a still-hot window.
        - Touch a tmux pane directly -- delivery is the existing dispatchd queue's job.
        - Fan out a Codex account-wide pause to per-lane sessions -- Codex has no per-lane usage snapshot yet (tracked gap, not implemented; see rate_limit_guard.py docstring).
    default_enabled: true
    commands:
      - name: chitra-rate-limit-guard
        description: Advance one detect/checkpoint/stop-verify/hold/resume sweep pass for one host's tracked sessions.
        argv: [chitra-rate-limit-guard]
        params: []
        mutates: true
      - name: chitra-ownership
        description: Report whether supplied session references belong to tracked working lanes on one host.
        argv: [chitra-ownership]
        params: []
        mutates: false

  - name: pr-review
    kind: tool
    purpose: >-
      Run deterministic blast-radius/diff-size pre-checks plus an isolated multi-reviewer
      security pass over one pull request, then log and report the findings.
    when_to_use: Run under an external trigger (a GitHub Actions pull_request step, or an operator/cron invocation) against one specific pull request.
    authority:
      level: act
      grants:
        - Read one pull request's metadata and diff via the gh CLI.
        - Run isolated claude -p reviewer processes against that diff only, never against chitra's own prospective reply.
        - Append a signed, deduplicated report to the local PR-review ledger.
        - Post one plain gh pr comment reporting findings.
      excludes:
        - Merge, approve, or request changes on a pull request.
        - Fail a required check or otherwise block a merge (block_on_findings defaults to false and is never flipped by this tool itself).
        - Author or edit any code in the reviewed pull request.
    default_enabled: true
    commands:
      - name: chitra-pr-review
        description: Fetch one pull request, run the PR security review gate, and report findings as a non-blocking comment.
        argv: [chitra-pr-review]
        params: []
        mutates: true

  - name: failover
    kind: tool
    purpose: >-
      Expose the rate-limit guard's own pause and resume steps as verbs a person can run:
      show the plan, start the pause for one lane, start the resume for one lane.
    when_to_use: Run by hand when an operator needs to see or take a failover step now, rather than waiting for the guard's next timed sweep.
    authority:
      level: act
      grants:
        - Report what the guard would pause and resume right now, changing nothing.
        - Start a pause transaction for one named lane that the guard's own planner already qualified.
        - Start a resume transaction for one held lane whose window has reset and whose fresh usage reads ok.
      excludes:
        - Pause or resume a lane the guard's planner refused -- there is one decision path, and this command does not overrule it.
        - Clear a hold directly; a hold clears only on a confirmed resume delivery.
        - Override an operator- or throttle-held lane.
    default_enabled: true
    commands:
      - name: chitra-failover
        description: Evaluate, start, or reverse a rate-limit lane pause using the guard's own planner.
        argv: [chitra-failover]
        params: []
        mutates: true

  - name: parallel-coordination
    kind: tool
    purpose: Publish advisory shared-resource presence and route direct questions to peer monitors.
    when_to_use: Declare a resource before heavy use, inspect peer declarations, or ask a named peer to coordinate.
    authority:
      level: record
      grants:
        - Append presence to one named instance's file and read the union of all presence files.
        - Enqueue one governed dispatch order for a named peer instance's session and read that order's durable result state.
      excludes:
        - Claim, lock, expire, steal, wait for, or grant authority over a shared resource.
        - Create a peer socket, daemon, or implicit message consumer.
        - Assert delivery or consumption that dispatchd did not already record durably.
    default_enabled: true
    commands:
      - name: chitra-presence
        description: Publish or list advisory shared-resource presence without blocking.
        argv: [chitra-presence]
        params: []
        mutates: true
      - name: chitra-peer
        description: Send peer questions through the governed dispatch queue and read their truthful result state.
        argv: [chitra-peer]
        params: []
        mutates: true

  - name: auto-merge
    kind: tool
    purpose: >-
      Merge lane-authored pull requests that are verifiably green, on repositories an operator
      allowlisted, under the automation app's identity, recording every attempt and refusal.
    when_to_use: Run the daemon under systemd to merge continuously, or the single-pull-request verb by hand to see the same decision for one pull request.
    authority:
      level: act
      grants:
        - Read one pull request's merge state through the GitHub GraphQL API.
        - Merge one allowlisted, lane-authored, non-draft pull request whose merge state is clean and whose check rollup succeeded.
        - Append an identity-stamped ledger line for every merge and every refusal.
        - Tell the one lane whose goal names that pull request that it merged.
      excludes:
        - Merge under any identity other than the configured GitHub App.
        - Read, write, or work around branch protection.
        - Merge a pull request carrying the hold label, or one whose checks are merely non-required failures.
        - Merge more than one pull request at a time in a single repository.
    default_enabled: false
    commands:
      - name: chitra-merge
        description: Verify one pull request against the merge policy and merge it when it qualifies.
        argv: [chitra-merge]
        params: []
        mutates: true
      - name: polyphony-chitra-merged
        description: Poll allowlisted repositories and merge lane-authored pull requests that qualify.
        argv: [polyphony-chitra-merged]
        params: []
        mutates: true
