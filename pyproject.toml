[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chitra-monitor"
version = "0.18.0"
description = "Persistent goal-bound supervision and deterministic tmux delivery for AI-agent fleets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "the maintainer" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "structlog>=26.1.0,<27",
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
boardd = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.1,<1",
    "watchfiles>=1.2.0,<2",
]
test = [
    "chitra-monitor[boardd]",
    "pytest>=9.1.1,<9.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21,<0.17",
    "mypy>=2.2.0,<3",
    "types-PyYAML>=6.0.12.20260518,<7",
    "httpx>=0.28.1,<1",
]

[project.scripts]
dispatchd = "chitra.dispatchd:main"
monitord = "chitra.monitord:main"
chitra-monitord = "chitra.monitord:main"
triaged = "chitra.triaged:main"
draft-scanner = "chitra.draft_scanner:main"
chitra-goals = "chitra.goals_cli:main"
chitra-receipts = "chitra.receipts_cli:main"
chitra-review = "chitra.review_cli:main"
chitra-artifacts = "chitra.artifacts:main"
chitra-usage = "chitra.usage:main"
chitra-rate-limit-guard = "chitra.rate_limit_guard:main"
chitra-ownership = "chitra.ownership:main"
chitra-sweepd = "chitra.sweepd:main"
chitra-convo = "chitra.convlog:main"
chitra-capabilities = "chitra.capabilities:main"
chitra-pr-review = "chitra.pr_reviewd:main"
chitra-lane-anchor = "chitra.lane_anchor:main"
chitra-lane-session = "chitra.lane_anchor:main"
chitra-decisions = "chitra.decisions:main"
chitra-agent = "chitra.agent_cli:main"
chitra-merge = "chitra.merge_cli:main"
chitra-failover = "chitra.failover_cli:main"
chitra-presence = "chitra.presence_cli:main"
chitra-peer = "chitra.peer_cli:main"
chitra-convert = "tools.convert.topology:main"
polyphony-chitra-merged = "chitra.merged:main"

[project.urls]
Homepage = "https://github.com/ReticleWorks/chitra"
Repository = "https://github.com/ReticleWorks/chitra"
Issues = "https://github.com/ReticleWorks/chitra/issues"
Changelog = "https://github.com/ReticleWorks/chitra/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/chitra", "src/boardd", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The boardd seed generator embeds full-sentence translation pairs; keeping
# each raw/translated line intact beats wrapping them at 140 columns.
"tools/gen_boardd_seed.py" = ["E501"]
